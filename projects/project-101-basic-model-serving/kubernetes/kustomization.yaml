apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ml-serving

resources:
- namespace.yaml
- configmap.yaml
- deployment.yaml
- service.yaml

secretGenerator:
- name: ghcr-pull
  files:
  - .dockerconfigjson=.secrets/ghcr-dockerconfig.json
  type: kubernetes.io/dockerconfigjson

generatorOptions:
  disableNameSuffixHash: true