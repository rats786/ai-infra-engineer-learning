name: Publish Basic Model Serving image

on:
  push:
    tags:
      - "project-101-basic-model-serving-v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/rats786/project-101-basic-model-serving
          flavor: latest=false
          tags: |
            type=match,pattern=project-101-basic-model-serving-(.*),group=1

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: ./projects/project-101-basic-model-serving
          file: ./projects/project-101-basic-model-serving/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
